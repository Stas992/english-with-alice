name: Publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get site files
        uses: actions/checkout@v7
      - name: Prepare Pages files
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
